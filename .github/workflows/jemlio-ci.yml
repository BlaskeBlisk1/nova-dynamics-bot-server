name: Jemlio CI

on:
  push:
    branches: [main, codex/inbound-enquiry-pipeline]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jemlio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      OPENAI_API_KEY: ''
      NOVA_DATABASE_URL: ''
      RESEND_API_KEY: ''
      AIRTABLE_PERSONAL_ACCESS_TOKEN: ''
      NOVA_CAPTURE_CRM_ENABLED: 'false'
      JEMLIO_CALENDAR_SYNC_ENABLED: 'false'
      JEMLIO_CALENDAR_SYNC_CONFIG: ''
      JEMLIO_OWNER_ALERTS_ENABLED: 'false'
      JEMLIO_OWNER_ALERTS_CONFIG: ''
      JEMLIO_OFFERS_ENABLED: 'false'
      JEMLIO_WORKSPACE_ENABLED: 'false'
      JEMLIO_WORKSPACE_CONFIG: ''
      JEMLIO_BOOKING_ENABLED: 'false'
      JEMLIO_BOOKING_CONFIG: ''
      NOVA_CAPTURE_ENABLED: 'false'
      NOVA_CAPTURE_WORKER_ENABLED: 'false'
      NOVA_PREVIEW_ENABLED: 'false'
      NOVA_CAPTURE_CONFIG: ''
      NOVA_CAPTURE_SECRET: ''
      NOVA_CAPTURE_FROM: ''
      JEMLIO_ENQUIRY_WEBHOOK_URL: ''
      JEMLIO_WEBSITE_ENQUIRY_ENABLED: 'false'
      JEMLIO_WEBSITE_EMAIL_ENABLED: 'false'
      JEMLIO_WEBSITE_CRM_ENABLED: 'false'
      JEMLIO_NETLIFY_WEBHOOK_SECRET: ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Audit production dependencies for high or critical vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - run: npm test

  postgres-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: jemlio_ci
          POSTGRES_PASSWORD: throwaway-ci-only
          POSTGRES_DB: jemlio_capture_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jemlio_ci -d jemlio_capture_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      JEMLIO_TEST_DATABASE_URL: postgresql://jemlio_ci:throwaway-ci-only@127.0.0.1:5432/jemlio_capture_ci
      JEMLIO_THROWAWAY_DATABASE: 'true'
      NOVA_DATABASE_URL: ''
      OPENAI_API_KEY: ''
      RESEND_API_KEY: ''
      AIRTABLE_PERSONAL_ACCESS_TOKEN: ''
      NOVA_CAPTURE_CRM_ENABLED: 'false'
      JEMLIO_CALENDAR_SYNC_ENABLED: 'false'
      JEMLIO_CALENDAR_SYNC_CONFIG: ''
      JEMLIO_OWNER_ALERTS_ENABLED: 'false'
      JEMLIO_OWNER_ALERTS_CONFIG: ''
      JEMLIO_OFFERS_ENABLED: 'false'
      JEMLIO_WORKSPACE_ENABLED: 'false'
      JEMLIO_WORKSPACE_CONFIG: ''
      JEMLIO_BOOKING_ENABLED: 'false'
      JEMLIO_BOOKING_CONFIG: ''
      NOVA_CAPTURE_ENABLED: 'false'
      NOVA_CAPTURE_WORKER_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Test transactions, concurrent retries, worker leases and deletion races
        run: node scripts/test-capture-postgres.js
      - name: Test booking, offers, calendar, workspace and deletion races
        run: node scripts/test-booking-postgres.js
      - name: Test owner alert collection and worker leases concurrently
        run: node scripts/test-owner-alerts.js --postgres
