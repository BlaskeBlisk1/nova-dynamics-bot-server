name: Verify and apply missed-call implementation
on:
  push:
    branches: ['jemlio/missed-call-runtime-20261003']
    paths: ['.github/workflows/missed-call-apply.yml', '.github/missed-call-edits.json', '.github/missed-call-new-hashes.json']
permissions:
  contents: write
concurrency:
  group: jemlio-missed-call-apply
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: jemlio_missed_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      OPENAI_API_KEY: ''
      RESEND_API_KEY: ''
      NOVA_DATABASE_URL: ''
      NOVA_CAPTURE_ENABLED: 'false'
      NOVA_CAPTURE_WORKER_ENABLED: 'false'
      JEMLIO_WORKSPACE_ENABLED: 'false'
      JEMLIO_MISSED_CALLS_ENABLED: 'false'
      JEMLIO_MISSED_CALL_SEND_ENABLED: 'false'
      JEMLIO_CONVERSATIONS_ENABLED: 'false'
      JEMLIO_OFFER_SEND_ENABLED: 'false'
      JEMLIO_TEST_DATABASE_URL: 'postgresql://test:test@127.0.0.1:5432/jemlio_missed_ci'
      JEMLIO_THROWAWAY_DATABASE: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: jemlio/missed-call-runtime-20261003
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - name: Verify exact reviewed content before applying integration edits
        run: |
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/jemlio/missed-call-runtime-20261003'
          def digest(raw):return hashlib.sha256(raw).hexdigest()
          for name,sha in json.loads(Path('.github/missed-call-new-hashes.json').read_text()).items():
              p=Path(name);assert not p.is_absolute() and '..' not in p.parts
              assert digest(p.read_bytes())==sha,'New file mismatch: '+name
          prepared={}
          for item in json.loads(Path('.github/missed-call-edits.json').read_text()):
              name=item['path'];p=Path(name)
              assert not p.is_absolute() and '..' not in p.parts and not name.startswith('.github/') and name not in prepared
              raw=p.read_bytes();assert digest(raw)==item['before'],'Base changed: '+name
              lines=raw.decode('utf-8').splitlines(keepends=True);end=len(lines)
              for start,stop,value in reversed(item['edits']):
                  assert 0<=start<=stop<=end
                  lines[start:stop]=value.splitlines(keepends=True);end=start
              value=''.join(lines).encode('utf-8')
              assert digest(value)==item['after'],'Edited file mismatch: '+name
              prepared[name]=value
          for name,value in prepared.items():Path(name).write_bytes(value)
          print('All reviewed application source hashes verified.')
          PY
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Verify actual PostgreSQL transaction and lease behavior with fake provider
        run: node scripts/test-missed-calls.js --postgres
      - name: Save verified code on development branch
        run: |
          git config user.name 'Jemlio implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/missed-call-edits.json .github/missed-call-new-hashes.json .github/workflows/missed-call-source.yml .github/workflows/missed-call-apply.yml
          git add index.js package.json package-lock.json lib public scripts docs
          git commit -m 'Implement verified missed-call SMS recovery and private job intake'
          git push origin HEAD:jemlio/missed-call-runtime-20261003
      - name: Save reviewed source for recovery
        if: always()
        run: git diff > implementation-review.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: implementation-review
          path: implementation-review.diff
          retention-days: 3
          if-no-files-found: warn
