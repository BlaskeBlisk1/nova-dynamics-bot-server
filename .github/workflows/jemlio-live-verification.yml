name: Jemlio live release verification

on:
  push:
    branches: [codex/jemlio-release-verification]
    paths:
      - '.github/workflows/jemlio-live-verification.yml'
      - 'scripts/verify-release-live.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jemlio-live-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Public live checks only; never submit contact forms
        run: node scripts/verify-release-live.js --live
      - name: Preserve honest release report including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jemlio-live-verification
          path: release-verification/live.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve exact public marketing files for deployment
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jemlio-marketing-publish
          path: public/marketing/
          if-no-files-found: error
          retention-days: 14
