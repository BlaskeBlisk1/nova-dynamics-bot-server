name: Quote development source snapshot
on:
  push:
    branches: ['jemlio/quote-workflow-20260928']
    paths: ['.github/workflows/quote-development-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: |
          cp "$(command -v node)" jemlio-node
          tar -czf jemlio-runtime.tgz jemlio-node node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: jemlio-runtime
          path: jemlio-runtime.tgz
          retention-days: 1
          if-no-files-found: error
