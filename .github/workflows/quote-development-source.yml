name: Quote development source snapshot
on:
  push:
    branches: ['jemlio/quote-workflow-20260928']
    paths: ['.github/workflows/quote-development-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > jemlio-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: jemlio-source
          path: jemlio-source.tar
          retention-days: 1
          if-no-files-found: error
