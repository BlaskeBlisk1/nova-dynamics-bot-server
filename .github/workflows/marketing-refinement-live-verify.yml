name: Read-only marketing redesign verification
on:
  push:
    branches: ['jemlio/website-refinement-20261005']
    paths: ['.github/workflows/marketing-refinement-live-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Read deployed pages and validate source hashes
        run: |
          python3 - <<'PY'
          import json,time,hashlib,urllib.request,urllib.error
          from pathlib import Path
          expected={
            'styles.css':'8e970ae8f3a890a7e25bc24d1d9cc323b29442f9cd054491ff83b2229cae7b32',
            'site.js':'4d7851fa4302b4152adaf8927f6a810f9af0acefd0e2d6087701a5a424d7d875',
            'followup-demo.css':'f87de4ecde61bb77bcc11f4eb558667120013858d14b9f8556f42f622287ced9',
            'vvs-demo.js':'4ebd5ab122128141734b37366e2cabad49a75c0dc4077ac626d73d596ecd282e'
          }
          render='https://nova-dynamics-bot-server.onrender.com'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  assert r.status==200
                  return r.read()
          report={'render':{},'website':{},'prospectDemos':{},'errors':[],'realSubmissionsOrMessages':False}
          for attempt in range(18):
              try:
                  release=json.loads(get(render+'/api/release'));assert release['revision']=='671c7d46ff982c911e9ecb1515a3f7f3370bec23'
                  report['render']['revision']=release['revision'];break
              except Exception:
                  if attempt==17:raise
                  time.sleep(10)
          for name,sha in expected.items():report['render'][name]=hashlib.sha256(get(render+'/marketing/'+name)).hexdigest()==sha
          for client in ['fram','fyllingsdalen','onsoy','tiller','trafikk1','frankolsen','roma']:
              page=get(render+'/demos/'+client);config=json.loads(get(render+'/api/demo-config/'+client))
              report['prospectDemos'][client]={'available':bool(page),'correctClient':config.get('client')==client,'captureEnabled':config.get('features',{}).get('capture',{}).get('enabled',False)}
          for attempt in range(32):
              try:
                  html=get('https://www.jemlio.com/');decoded=html.decode('utf-8')
                  assert 'Jemlio holder' in decoded and 'class="hero-visual"' in decoded and 'id="tab-vvs"' in decoded
                  assets={name:get('https://www.jemlio.com/'+name) for name in expected}
                  report['website']={name:hashlib.sha256(raw).hexdigest()==expected[name] for name,raw in assets.items()}
                  assert all(report['website'].values())
                  report['website']['headlineAndVvsDemo']=True
                  report['website']['nativeFormPresent']='name="jemlio-demo-request"' in decoded and 'https://www.jemlio.com/demo-requested' in decoded
                  Path('public/marketing/index.html').write_bytes(html)
                  for name,raw in assets.items():Path('public/marketing',name).write_bytes(raw)
                  for name in ['quote-schema.js','quote-flow.js','followup-demo.js','vvs-profile.js']:
                      raw=get('https://www.jemlio.com/'+name)
                      assert hashlib.sha256(raw).hexdigest()==hashlib.sha256(Path('public/marketing',name).read_bytes()).hexdigest(),'Unchanged script differs: '+name
                      Path('public/marketing',name).write_bytes(raw)
                  report['website']['privacyAvailable']=b'Twilio' in get('https://www.jemlio.com/privacy')
                  report['website']['confirmationAvailable']=b'Takk for interessen' in get('https://www.jemlio.com/demo-requested')
                  break
              except Exception as e:
                  if attempt==31:report['errors'].append(type(e).__name__)
                  else:time.sleep(10)
          Path('marketing-live-report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          assert not report['errors'] and all(report['website'].values())
          assert all(v for k,v in report['render'].items() if k!='revision')
          assert all(v['available'] and v['correctClient'] for v in report['prospectDemos'].values())
          PY
      - name: Check the actual published markup and new SMS states
        run: |
          node <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),{JSDOM,VirtualConsole}=require('jsdom');
          const errors=[],requests=[],vc=new VirtualConsole();vc.on('jsdomError',e=>errors.push(String(e)));
          const dom=new JSDOM(fs.readFileSync('public/marketing/index.html','utf8'),{url:'https://www.jemlio.com/',runScripts:'outside-only',pretendToBeVisual:true,virtualConsole:vc});
          const w=dom.window,d=w.document;w.matchMedia=()=>({matches:true});w.HTMLElement.prototype.scrollIntoView=()=>{};
          w.IntersectionObserver=class{observe(){}disconnect(){}};w.fetch=(...args)=>{requests.push(args);throw Error('No writes allowed');};
          const form=d.getElementById('contact-form');assert.ok(form);assert.equal(form.method.toUpperCase(),'POST');assert.equal(form.action,'https://www.jemlio.com/demo-requested');assert.equal(form.name,'jemlio-demo-request');
          assert.equal(form.elements['form-name'].value,'jemlio-demo-request');assert.ok(form.elements['bot-field']);assert.ok(form.elements['bot-field'].closest('[hidden]'));assert.equal(form.elements['contact-request'].required,true);
          assert.ok([...form.elements.industry.options].some(o=>o.value==='Rørlegger / VVS'));
          // Netlify may remove build-only data-netlify attributes. Validate the served form contract, not build-only attributes.
          for(const file of ['quote-schema.js','quote-flow.js','followup-demo.js','vvs-profile.js','vvs-demo.js','site.js'])w.eval(fs.readFileSync('public/marketing/'+file,'utf8'));
          assert.equal(d.activeElement,d.body);assert.equal(d.getElementById('tab-vvs').getAttribute('aria-selected'),'true');
          const click=text=>{const b=[...d.querySelectorAll('.vvs-demo button')].find(e=>e.textContent===text);assert.ok(b,text);b.click();};
          click('Se et ubesvart anrop');let state=d.querySelector('.vvs-delivery [role=status]');assert.match(state.textContent,/levering er ikke bekreftet/);
          click('SMS levert');assert.match(state.textContent,/Kunden må fortsatt/);click('Uavklart');assert.match(state.textContent,/ikke automatisk en ny SMS/);
          click('Åpne eksempelhenvendelsen');assert.ok(d.querySelector('[name=problem]'));
          const menu=d.querySelector('.mobile-nav');menu.open=true;d.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert.equal(menu.open,false);
          assert.deepEqual(errors,[]);assert.equal(requests.length,0);assert.equal(w.localStorage.length,0);assert.equal(w.sessionStorage.length,0);
          const report=JSON.parse(fs.readFileSync('marketing-live-report.json','utf8'));report.publishedMarkupAndSmsInteractionPassed=true;fs.writeFileSync('marketing-live-report.json',JSON.stringify(report,null,2));
          w.close();console.log('Published native form, focus, mobile navigation and SMS states verified. No submissions or provider requests.');
          JS
      - name: Rehearse complete VVS and follow-up using downloaded production HTML and scripts
        run: node scripts/test-vvs-demo.js && node scripts/test-followup-demo.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketing-live-report
          path: marketing-live-report.json
          retention-days: 7
          if-no-files-found: warn
