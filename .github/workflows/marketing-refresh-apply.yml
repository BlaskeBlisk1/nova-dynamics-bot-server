name: Verify reviewed marketing refinement
on:
  push:
    branches: ['jemlio/website-refinement-20261005']
    paths: ['.github/workflows/marketing-refresh-apply.yml']
permissions:
  contents: write
concurrency:
  group: jemlio-marketing-refinement
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      OPENAI_API_KEY: ''
      RESEND_API_KEY: ''
      NOVA_DATABASE_URL: ''
      NOVA_CAPTURE_ENABLED: 'false'
      NOVA_CAPTURE_WORKER_ENABLED: 'false'
      JEMLIO_WORKSPACE_ENABLED: 'false'
      JEMLIO_MISSED_CALLS_ENABLED: 'false'
      JEMLIO_MISSED_CALL_SEND_ENABLED: 'false'
      JEMLIO_CONVERSATIONS_ENABLED: 'false'
      JEMLIO_CONVERSATION_SEND_ENABLED: 'false'
      JEMLIO_OFFER_SEND_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: jemlio/website-refinement-20261005
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - name: Verify transport and every source hash before applying
        run: |
          node <<'JS'
          const fs=require('node:fs'),crypto=require('node:crypto'),zlib=require('node:zlib');
          const encoded=[1,2,3,4].map(i=>fs.readFileSync(`.github/marketing-refresh.part${i}`,'utf8').trim()).join('');
          const bytes=Buffer.from(encoded,'base64');
          if(crypto.createHash('sha256').update(bytes).digest('hex')!=='19f5c4694cf04f02f86969621b0a677f12af20bd023a4e50695bdcdcbcfc7a89')throw Error('Transport hash mismatch');
          const data=zlib.brotliDecompressSync(bytes,{maxOutputLength:200000});
          fs.writeFileSync('.github/marketing-refresh-decoded.json',data);
          JS
          python3 - <<'PY'
          import json,hashlib,os
          from pathlib import Path
          assert os.environ['GITHUB_REF']=='refs/heads/jemlio/website-refinement-20261005'
          allowed={'public/marketing/index.html','public/marketing/styles.css','public/marketing/site.js','public/marketing/followup-demo.css','public/marketing/vvs-demo.js','public/marketing/privacy.html','public/marketing/demo-requested.html','public/marketing/form-definition.html','clients/jemlio/kb.json','scripts/test-marketing-refresh.js'}
          items=json.loads(Path('.github/marketing-refresh-decoded.json').read_text())
          assert len(items)==len(allowed) and {i['path'] for i in items}==allowed
          prepared={}
          for item in items:
              p=Path(item['path'])
              if item['before'] is None: assert not p.exists()
              else: assert hashlib.sha256(p.read_bytes()).hexdigest()==item['before'],'Source changed: '+str(p)
              if 'content' in item:
                  value=item['content']
              else:
                  value=p.read_text();end=len(value)
                  for start,stop,replacement in reversed(item['edits']):
                      assert 0<=start<=stop<=end
                      value=value[:start]+replacement+value[stop:];end=start
              raw=value.encode('utf-8')
              assert hashlib.sha256(raw).hexdigest()==item['sha256'],'Target mismatch: '+str(p)
              prepared[p]=raw
          for p,raw in prepared.items():p.write_bytes(raw)
          Path('.github/marketing-refresh-decoded.json').unlink()
          p=Path('package.json');data=json.loads(p.read_text())
          assert 'test:marketing-refresh' not in data['scripts']
          data['scripts']['test:marketing-refresh']='node scripts/test-marketing-refresh.js'
          data['scripts']['test']+=' && npm run test:marketing-refresh'
          p.write_text(json.dumps(data,indent=2)+'\n')
          print('Ten reviewed source files applied. Existing backend and credential work preserved.')
          PY
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - name: Commit tested presentation on development branch only
        run: |
          git config user.name 'Jemlio implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/marketing-refresh.part1 .github/marketing-refresh.part2 .github/marketing-refresh.part3 .github/marketing-refresh.part4 .github/workflows/marketing-refresh-apply.yml
          git add public/marketing clients/jemlio/kb.json scripts/test-marketing-refresh.js package.json
          git commit -m 'Refine the VVS website and demonstrate built recovery, quoting and follow-up'
          git push origin HEAD:jemlio/website-refinement-20261005
