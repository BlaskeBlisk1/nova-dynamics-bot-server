name: Prepare reviewed VVS website bundle
on:
  push:
    branches: ['codex/enquiry-readiness']
    paths: ['.github/workflows/vvs-publish-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/enquiry-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - name: Copy only reviewed public assets and bundle tests
        run: |
          git fetch origin 2bbdc9de0ce4947f638e639bcdecd54670bd20d4
          python3 - <<'PY'
          import subprocess,hashlib
          from pathlib import Path
          source='2bbdc9de0ce4947f638e639bcdecd54670bd20d4'
          expected={
            'public/marketing/index.html':'efb9c6ffee2b3ea317a828322da106cf84e67898b99d6932af38b7600e26a8d6',
            'public/marketing/site.js':'cd963e9ca9bf50c4722cb188994e404184836a6fc0db5bab341e2c5d6923b0f9',
            'public/marketing/followup-demo.js':'e95fdf5822f976cb0133a995342e9c9285d8ca2a4bb8417d9a89f5056f549418',
            'public/marketing/followup-demo.css':'9e77fdb9104393fbb27cb1ae3e3e0e4721f5e50133c91cd90680f3f26874dfbd',
            'public/marketing/vvs-profile.js':'bcae00a7e6be98bd9db4b2a2e2ce6bf00b9a0c476c291cd86779c1c237f289b3',
            'public/marketing/vvs-demo.js':'03e6b72e5bd8d6b4b79192fdb6a9ea37e32cde0e24c99d78b2c7cb3656ca2016',
            'scripts/staging-site-task.cjs':'9ebb1d7adb2d6d55f02599f8932455a8a0bf1084049563919802863105a4eb05',
            'scripts/test-staging-site-task.cjs':'2a263d915cc5d8008e5c42e75381400af64a56dd00f71590b655de782f5e2bb7',
            'scripts/test-marketing-ui.js':'5584620503b5c31f04fbb34ae9664043dc3f662a5c7bdb9989c79b0c31e21d48'
          }
          bases={
            'public/marketing/index.html':'3bfc1da0d8cedbffc11ee34394dbb5a8bd805ddafc94a3782e77abac45b24523',
            'public/marketing/site.js':'c018e7e9c62ef4e1960516fda2e9b6761967b122c3c0f1468cc454f1f4368560',
            'public/marketing/followup-demo.js':'e8458bf32eb993436bdc46402671eff3b671ab04ead3aaf52a09c58678c69800',
            'public/marketing/followup-demo.css':'0e40dff9f8b54e11302282e93b147c995728cd5a3d9f4c90c72b368c77fc7e15',
            'scripts/staging-site-task.cjs':'59a5acae9151e961c426e01fa91dec9f5f362b09a7f1d326dfe8024ffb3cdad0',
            'scripts/test-staging-site-task.cjs':'2f6ab859909673e697c456cb6c7539698417d723f38bcc525045a453f3e65f4c',
            'scripts/test-marketing-ui.js':'9425c821f9472131d3c068d07bc24fcdfda1779417f83593d3722ffd3b9f62f0'
          }
          for name,digest in bases.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,'Publisher changed: '+name
          prepared={}
          for name,digest in expected.items():
              data=subprocess.check_output(['git','show',source+':'+name])
              assert hashlib.sha256(data).hexdigest()==digest,'Source mismatch: '+name
              prepared[name]=data
          for name,data in prepared.items():Path(name).write_bytes(data)
          print('Verified public assets only; no client configuration or backend code copied.')
          PY
      - run: npm ci --ignore-scripts
      - run: node scripts/test-followup-demo.js && npm run test:marketing-ui && npm run test:staging-site
      - name: Save prepared bundle on isolated publisher branch
        run: |
          git config user.name 'Jemlio implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/vvs-publish-prep.yml
          git add public/marketing scripts/staging-site-task.cjs scripts/test-staging-site-task.cjs scripts/test-marketing-ui.js
          git commit -m 'Prepare reviewed VVS pilot presentation for public website publication'
          git push origin HEAD:codex/enquiry-readiness
