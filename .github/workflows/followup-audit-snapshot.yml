name: Follow-up source and public-page audit
on:
  push:
    branches: ['jemlio/followup-polish-20261001']
    paths: ['.github/workflows/followup-audit-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          mkdir -p audit/live
          git archive --format=tar HEAD > audit/source.tar
          git fetch origin codex/enquiry-readiness
          git archive --format=tar FETCH_HEAD public/marketing scripts/staging-site-task.cjs scripts/staging-enquiry-setup.cjs > audit/publisher.tar
          python3 - <<'PY'
          import json,urllib.request,urllib.error
          from pathlib import Path
          root=Path('audit/live');report={}
          hosts={'website':'https://www.jemlio.com','server':'https://nova-dynamics-bot-server.onrender.com'}
          paths={'website':['/','/site.js','/styles.css','/quote-flow.js','/quote-flow.css','/quote-schema.js'], 'server':['/api/release','/api/workspace/session','/workspace-demo','/api/demo-config/tiller','/api/demo-config/frankolsen','/api/demo-config/fram']}
          for host,items in paths.items():
              for i,p in enumerate(items):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(hosts[host]+p,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                          raw=r.read(); (root/(host+'-'+str(i)+'.txt')).write_bytes(raw)
                          report[host+p]={'status':r.status,'headers':dict(r.headers),'file':host+'-'+str(i)+'.txt'}
                  except urllib.error.HTTPError as e: report[host+p]={'status':e.code}
                  except Exception as e: report[host+p]={'error':type(e).__name__}
          (root/'report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({k:v.get('status',v.get('error')) for k,v in report.items()},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: followup-audit
          path: audit/
          retention-days: 3
          if-no-files-found: error
