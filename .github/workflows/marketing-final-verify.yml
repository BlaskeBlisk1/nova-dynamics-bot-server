name: Final marketing release verification
on:
  push:
    branches: ['jemlio/website-contrast-20261005']
    paths: ['.github/workflows/marketing-final-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm the final revision and identical public assets
        run: |
          python3 - <<'PY'
          import json,hashlib,time,urllib.request
          from pathlib import Path
          expected={
            'styles.css':'7ae6a63bdcad154ac7071b3e5104d1caea0d44ad7b54013db06e051278dd713d',
            'site.js':'4d7851fa4302b4152adaf8927f6a810f9af0acefd0e2d6087701a5a424d7d875',
            'followup-demo.css':'f87de4ecde61bb77bcc11f4eb558667120013858d14b9f8556f42f622287ced9',
            'vvs-demo.js':'4ebd5ab122128141734b37366e2cabad49a75c0dc4077ac626d73d596ecd282e'
          }
          render='https://nova-dynamics-bot-server.onrender.com'
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=15) as r:
                  assert r.status==200
                  return r.read()
          for attempt in range(15):
              try:
                  report={'revision':json.loads(get(render+'/api/release'))['revision'],'assets':{},'errors':[],'realSubmissionsOrMessages':False}
                  assert report['revision']=='d2c39c93d9994ae6592709c0567e8a5a46987786'
                  for host,prefix in [('website','https://www.jemlio.com/'),('render',render+'/marketing/')]:
                      report['assets'][host]={name:hashlib.sha256(get(prefix+name)).hexdigest()==sha for name,sha in expected.items()}
                      assert all(report['assets'][host].values())
                  html=get('https://www.jemlio.com/').decode('utf-8')
                  report['headlineAndDemo']='Jemlio holder' in html and 'class="hero-product"' in html and 'id="tab-vvs"' in html
                  report['nativeForm']='name="jemlio-demo-request"' in html and 'https://www.jemlio.com/demo-requested' in html
                  report['privacyAvailable']=b'Twilio' in get('https://www.jemlio.com/privacy')
                  report['confirmationAvailable']=b'Takk for interessen' in get('https://www.jemlio.com/demo-requested')
                  assert report['headlineAndDemo'] and report['nativeForm'] and report['privacyAvailable'] and report['confirmationAvailable']
                  Path('marketing-final-report.json').write_text(json.dumps(report,indent=2))
                  print(json.dumps(report,indent=2))
                  break
              except Exception:
                  if attempt==14:raise
                  time.sleep(8)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: marketing-final-report
          path: marketing-final-report.json
          retention-days: 7
          if-no-files-found: error
