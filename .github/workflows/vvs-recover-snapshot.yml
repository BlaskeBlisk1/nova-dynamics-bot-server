name: Recover interrupted VVS source
on:
  push:
    branches: ['jemlio/vvs-pilot-20261003']
    paths: ['.github/workflows/vvs-recover-snapshot.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          mkdir -p recovery
          git archive --format=tar HEAD > recovery/source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: vvs-recovery
          path: recovery/
          retention-days: 3
          if-no-files-found: error
