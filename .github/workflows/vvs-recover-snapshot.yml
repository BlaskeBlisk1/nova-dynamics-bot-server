name: Recover interrupted VVS source
on:
  push:
    branches: ['jemlio/vvs-pilot-20261003']
    paths: ['.github/workflows/vvs-recover-snapshot.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          mkdir -p recovery
          git archive --format=tar HEAD > recovery/source.tar
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          parts=sorted(Path('.github').glob('vvs-patch.part*'))
          data=''.join(p.read_text().strip() for p in parts)
          if data:
              decoder=zlib.decompressobj(31)
              raw=decoder.decompress(base64.b64decode(data+'='*((-len(data))%4)),2000000)
              Path('recovery/partial-source.txt').write_bytes(raw)
              print('Recovered bytes:',len(raw),'Complete stream:',decoder.eof)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vvs-recovery
          path: recovery/
          retention-days: 3
          if-no-files-found: error
