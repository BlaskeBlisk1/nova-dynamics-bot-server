name: Correct selected SMS state contrast
on:
  push:
    branches: ['jemlio/website-contrast-20261005', 'codex/enquiry-readiness']
    paths: ['.github/workflows/site-contrast-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: |
          python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          assert os.environ['GITHUB_REF_NAME'] in ['jemlio/website-contrast-20261005','codex/enquiry-readiness']
          p=Path('public/marketing/styles.css');raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='8e970ae8f3a890a7e25bc24d1d9cc323b29442f9cd054491ff83b2229cae7b32'
          old='.vvs-delivery .fu-actions button[aria-pressed=true]';text=raw.decode('utf-8');assert text.count(old)==1
          new=text.replace(old,'#demo-panel '+old).encode('utf-8')
          assert hashlib.sha256(new).hexdigest()=='7ae6a63bdcad154ac7071b3e5104d1caea0d44ad7b54013db06e051278dd713d'
          p.write_bytes(new)
          PY
      - run: npm ci --ignore-scripts
      - run: node scripts/test-marketing-refresh.js --frontend-only && npm run test:marketing-ui && npm run test:staging-site
      - run: |
          git config user.name 'Jemlio implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/site-contrast-fix.yml
          git add public/marketing/styles.css
          git commit -m 'Keep the selected SMS-status label dark on its light background'
          git push origin HEAD:${GITHUB_REF_NAME}
