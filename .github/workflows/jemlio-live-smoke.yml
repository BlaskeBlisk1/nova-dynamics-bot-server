name: Jemlio public release smoke

on:
  push:
    branches: [main]
    paths:
      - 'index.js'
      - 'lib/**'
      - 'clients/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/verify-safe-release.cjs'
      - '.github/workflows/jemlio-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jemlio-public-release-smoke
  cancel-in-progress: false

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JEMLIO_EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - name: Wait for this revision, then check demos, website chat and intake configuration
        run: node scripts/verify-safe-release.cjs --live
      - name: Preserve the public smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jemlio-safe-public-smoke
          path: release-verification/safe-live.json
          if-no-files-found: warn
          retention-days: 14
