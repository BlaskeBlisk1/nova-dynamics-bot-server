name: Missed call development snapshot
on:
  push:
    branches: ['jemlio/missed-call-runtime-20261003']
    paths: ['.github/workflows/missed-call-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: npm install --ignore-scripts --save-exact twilio
      - run: |
          mkdir -p snapshot
          git archive --format=tar HEAD > snapshot/source.tar
          cp package.json package-lock.json snapshot/
          cp "$(command -v node)" jemlio-node
          tar -czf snapshot/runtime.tgz jemlio-node node_modules
          node -e "console.log('Twilio SDK:',require('twilio/package.json').version)"
      - uses: actions/upload-artifact@v4
        with:
          name: missed-call-source
          path: snapshot/
          retention-days: 3
          if-no-files-found: error
