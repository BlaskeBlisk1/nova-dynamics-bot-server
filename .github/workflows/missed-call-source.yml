name: Missed call development snapshot
on:
  push:
    branches: ['jemlio/missed-call-runtime-20261003']
    paths: ['.github/workflows/missed-call-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD > source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: missed-call-source
          path: source.tar
          retention-days: 3
          if-no-files-found: error
