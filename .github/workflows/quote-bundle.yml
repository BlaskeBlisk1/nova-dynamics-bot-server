name: Include quote assets in isolated site publisher
on:
  push:
    branches: ['jemlio/quote-workflow-20260928']
    paths: ['.github/workflows/quote-bundle.yml']
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: jemlio/quote-workflow-20260928
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/staging-site-task.cjs');s=p.read_text()
          old="'robots.txt', 'site.js', 'sitemap.xml', 'styles.css']);"
          assert s.count(old)==1
          p.write_text(s.replace(old,"'robots.txt', 'site.js', 'sitemap.xml', 'styles.css', 'quote-schema.js', 'quote-flow.js', 'quote-flow.css']);"))
          p=Path('scripts/test-staging-site-task.cjs');s=p.read_text()
          assert s.count('assert.equal(FILES.length, 12)')==1
          assert s.count('assert.equal(first.files, 12)')==1
          p.write_text(s.replace('assert.equal(FILES.length, 12)','assert.equal(FILES.length, 15)').replace('assert.equal(first.files, 12)','assert.equal(first.files, 15)').replace('only twelve allowlisted','only fifteen allowlisted'))
          PY
      - run: npm ci --ignore-scripts
      - run: npm run test:staging-site
      - run: |
          git config user.name 'Jemlio implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/quote-bundle.yml
          git add scripts/staging-site-task.cjs scripts/test-staging-site-task.cjs
          git commit -m 'Include the three verified quote UI assets in the isolated marketing bundle'
          git push origin HEAD:jemlio/quote-workflow-20260928
