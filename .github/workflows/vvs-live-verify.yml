name: Read-only VVS release verification
on:
  push:
    branches: ['jemlio/vvs-pilot-20261003']
    paths: ['.github/workflows/vvs-live-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Verify deployed revision, VVS assets and preserved demo routes
        run: |
          python3 - <<'PY'
          import json,hashlib,time,urllib.request,urllib.error
          from pathlib import Path
          expected={
            'vvs-profile.js':'bcae00a7e6be98bd9db4b2a2e2ce6bf00b9a0c476c291cd86779c1c237f289b3',
            'vvs-demo.js':'03e6b72e5bd8d6b4b79192fdb6a9ea37e32cde0e24c99d78b2c7cb3656ca2016',
            'followup-demo.js':'e95fdf5822f976cb0133a995342e9c9285d8ca2a4bb8417d9a89f5056f549418',
            'followup-demo.css':'9e77fdb9104393fbb27cb1ae3e3e0e4721f5e50133c91cd90680f3f26874dfbd',
            'site.js':'cd963e9ca9bf50c4722cb188994e404184836a6fc0db5bab341e2c5d6923b0f9'
          }
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=20) as r:
                  assert r.status==200
                  return r.read()
          report={'render':{},'website':{},'prospectDemos':{},'liveClientReadiness':{},'errors':[]}
          render='https://nova-dynamics-bot-server.onrender.com'
          for attempt in range(15):
              try:
                  revision=json.loads(get(render+'/api/release'))['revision']
                  assert revision=='612434ebbf30c12099f356f6cee3ae467c58c235'
                  report['render']['revision']=revision
                  break
              except Exception as e:
                  if attempt==14:raise
                  time.sleep(10)
          for name,digest in expected.items():report['render'][name]=hashlib.sha256(get(render+'/marketing/'+name)).hexdigest()==digest
          for client in ['fram','fyllingsdalen','onsoy','tiller','trafikk1','frankolsen','roma']:
              page=get(render+'/demos/'+client)
              cfg=json.loads(get(render+'/api/demo-config/'+client))
              report['prospectDemos'][client]={'available':bool(page),'correctClient':cfg['client']==client,'captureEnabled':cfg.get('features',{}).get('capture',{}).get('enabled',False)}
          try:
              get(render+'/api/workspace/session');report['liveClientReadiness']['workspaceHttpStatus']=200
          except urllib.error.HTTPError as e:report['liveClientReadiness']['workspaceHttpStatus']=e.code
          for attempt in range(36):
              try:
                  html=get('https://www.jemlio.com/');decoded=html.decode('utf-8')
                  assert 'id="tab-vvs"' in decoded and 'data-open-vvs' in decoded and 'For rørlegger- og VVS-bedrifter' in decoded
                  assets={name:get('https://www.jemlio.com/'+name) for name in expected}
                  report['website']={name:hashlib.sha256(data).hexdigest()==expected[name] for name,data in assets.items()}
                  assert all(report['website'].values())
                  report['website']['vvsTabAndPositioning']=True
                  report['website']['nativeFormPreserved']='name="jemlio-demo-request"' in decoded and 'https://www.jemlio.com/demo-requested' in decoded and 'netlify-honeypot="bot-field"' in decoded
                  Path('public/marketing/index.html').write_bytes(html)
                  for name,data in assets.items():Path('public/marketing',name).write_bytes(data)
                  Path('public/marketing/quote-schema.js').write_bytes(get('https://www.jemlio.com/quote-schema.js'))
                  break
              except Exception as e:
                  if attempt==35:report['errors'].append(type(e).__name__)
                  else:time.sleep(10)
          report['liveClientReadiness'].update(realCallsOrMessagesSent=False,productionSchemaVerified=False,clientActivatedByThisRelease=False)
          Path('vvs-live-report.json').write_text(json.dumps(report,indent=2));print(json.dumps(report,indent=2))
          assert all(value for key,value in report['render'].items() if key!='revision')
          assert not report['errors'] and report['website'] and all(report['website'].values())
          assert all(x['available'] and x['correctClient'] and not x['captureEnabled'] for x in report['prospectDemos'].values())
          PY
      - name: Exercise downloaded production scripts with all requests intercepted
        run: node scripts/test-vvs-demo.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vvs-live-report
          path: vvs-live-report.json
          retention-days: 7
          if-no-files-found: warn
