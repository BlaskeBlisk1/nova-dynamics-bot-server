name: Prepare reviewed follow-up website bundle
on:
  push:
    branches: ['codex/enquiry-readiness']
    paths: ['.github/workflows/followup-publish-prep.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/enquiry-readiness
      - uses: actions/setup-node@v7
        with:
          node-version: '>=24.15.0 <25'
          package-manager-cache: false
      - run: |
          git fetch origin cdd42968d505f139ca34a34313918b25c1636d9b
          python3 - <<'PY'
          import subprocess,hashlib
          from pathlib import Path
          source='cdd42968d505f139ca34a34313918b25c1636d9b'
          expected={
            'public/marketing/index.html':'3bfc1da0d8cedbffc11ee34394dbb5a8bd805ddafc94a3782e77abac45b24523',
            'public/marketing/site.js':'c018e7e9c62ef4e1960516fda2e9b6761967b122c3c0f1468cc454f1f4368560',
            'public/marketing/followup-demo.js':'e8458bf32eb993436bdc46402671eff3b671ab04ead3aaf52a09c58678c69800',
            'public/marketing/followup-demo.css':'0e40dff9f8b54e11302282e93b147c995728cd5a3d9f4c90c72b368c77fc7e15',
            'scripts/staging-site-task.cjs':'59a5acae9151e961c426e01fa91dec9f5f362b09a7f1d326dfe8024ffb3cdad0',
            'scripts/test-staging-site-task.cjs':'2f6ab859909673e697c456cb6c7539698417d723f38bcc525045a453f3e65f4c',
            'scripts/test-followup-demo.js':'058017f7ab82b75df50a40df5c37a456d104ca60ea643cc5fa790ba4392bd59f'
          }
          bases={
            'public/marketing/index.html':'64fcdc8067958cfbd315e5561fcec9bf1df04850cc92c954072d12540b618429',
            'public/marketing/site.js':'8003a01ba83fad4e64835af53a6be9e639e4ae6d33cc886e72c3474927e7368b',
            'scripts/staging-site-task.cjs':'1955b2bc3673428f04458b916063937393d7b7f3d19a6d3db0267b9a170d7a47',
            'scripts/test-staging-site-task.cjs':'fba80574807ca97e59380b07ce3973863a41f4b1b5c3806f7aa17b4f7a610a96'
          }
          for name,digest in bases.items():assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==digest,'Publisher changed: '+name
          for name,digest in expected.items():
              data=subprocess.check_output(['git','show',source+':'+name]);assert hashlib.sha256(data).hexdigest()==digest,'Unreviewed source: '+name
              Path(name).write_bytes(data)
          PY
      - run: npm ci --ignore-scripts
      - run: node scripts/test-followup-demo.js && npm run test:marketing-ui && npm run test:staging-site
      - run: |
          git config user.name 'Jemlio implementation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/followup-publish-prep.yml
          git add public/marketing scripts/staging-site-task.cjs scripts/test-staging-site-task.cjs scripts/test-followup-demo.js
          git commit -m 'Prepare the reviewed Oppfølging experience in the isolated public bundle'
          git push origin HEAD:codex/enquiry-readiness
