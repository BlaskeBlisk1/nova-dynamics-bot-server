<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Skjemadefinisjon | Jemlio</title>
</head>
<body>
  <!-- Build-time definition only. Keep every field name synchronized with the visible contact form. -->
  <form name="jemlio-demo-request" method="POST" action="https://www.jemlio.com/demo-requested" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="jemlio-demo-request">
    <input name="bot-field" autocomplete="off" tabindex="-1">
    <input name="name" maxlength="120" required>
    <input name="email" type="email" maxlength="254" required>
    <input name="company" maxlength="300" required>
    <select name="industry">
      <option value="">Velg hvis du ønsker</option>
      <option value="Trafikkskole">Trafikkskole</option>
      <option value="Optiker">Optiker</option>
      <option value="Flytting og transport">Flytting og transport</option>
      <option value="Annen tjenestebedrift">Annen tjenestebedrift</option>
    </select>
    <textarea name="message" maxlength="1000"></textarea>
    <input name="contact-request" type="checkbox" value="Jeg ber Jemlio kontakte meg om min gratis mini-demo" required>
  </form>
  <main><p>Denne siden definerer feltene i kontaktskjemaet. <a href="https://www.jemlio.com/#contact">Åpne kontaktskjemaet hos Jemlio.</a></p></main>
</body>
</html>
